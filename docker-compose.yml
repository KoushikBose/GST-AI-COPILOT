version: "3.9"

# GST AI Copilot — local development stack
# Bring the whole platform up with: docker compose up -d
# All components are open-source / self-hostable. No cloud provider required.

x-backend-env: &backend-env
  APP_ENV: ${APP_ENV:-development}
  APP_SECRET_KEY: ${APP_SECRET_KEY:-dev-secret-change-me}
  DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-gst_copilot}:${POSTGRES_PASSWORD:-gst_copilot_pw}@postgres:5432/${POSTGRES_DB:-gst_copilot}
  DATABASE_URL_SYNC: postgresql+psycopg://${POSTGRES_USER:-gst_copilot}:${POSTGRES_PASSWORD:-gst_copilot_pw}@postgres:5432/${POSTGRES_DB:-gst_copilot}
  REDIS_URL: redis://redis:6379/0
  CELERY_BROKER_URL: redis://redis:6379/1
  CELERY_RESULT_BACKEND: redis://redis:6379/2
  QDRANT_URL: http://qdrant:6333
  OBJECT_STORAGE_ENDPOINT: minio:9000
  OBJECT_STORAGE_ACCESS_KEY: ${OBJECT_STORAGE_ACCESS_KEY:-gst_copilot_admin}
  OBJECT_STORAGE_SECRET_KEY: ${OBJECT_STORAGE_SECRET_KEY:-change-me-minio-secret}
  OBJECT_STORAGE_SECURE: "false"
  OLLAMA_BASE_URL: http://ollama:11434
  OLLAMA_MODEL: ${OLLAMA_MODEL:-qwen2.5:7b-instruct}
  JWT_SECRET: ${JWT_SECRET:-dev-jwt-secret-change-me}
  OTEL_EXPORTER_OTLP_ENDPOINT: http://jaeger:4317

services:
  # ---------------------------------------------------------------- Postgres
  postgres:
    image: postgres:16-alpine
    container_name: gst_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-gst_copilot}
      POSTGRES_USER: ${POSTGRES_USER:-gst_copilot}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-gst_copilot_pw}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-gst_copilot} -d ${POSTGRES_DB:-gst_copilot}"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks: [gst_network]

  # ------------------------------------------------------------------- Redis
  redis:
    image: redis:7-alpine
    container_name: gst_redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks: [gst_network]

  # ----------------------------------------------------------------- Qdrant
  qdrant:
    image: qdrant/qdrant:v1.11.0
    container_name: gst_qdrant
    restart: unless-stopped
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant_data:/qdrant/storage
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'exec 3<>/dev/tcp/127.0.0.1/6333' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks: [gst_network]

  # ------------------------------------------------------------------ MinIO
  minio:
    image: minio/minio:latest
    container_name: gst_minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${OBJECT_STORAGE_ACCESS_KEY:-gst_copilot_admin}
      MINIO_ROOT_PASSWORD: ${OBJECT_STORAGE_SECRET_KEY:-change-me-minio-secret}
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks: [gst_network]

  minio-init:
    image: minio/mc:latest
    container_name: gst_minio_init
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 ${OBJECT_STORAGE_ACCESS_KEY:-gst_copilot_admin} ${OBJECT_STORAGE_SECRET_KEY:-change-me-minio-secret} &&
      mc mb -p local/gst-documents local/invoices local/supporting-documents local/knowledge-documents local/exports local/backups &&
      exit 0
      "
    networks: [gst_network]

  # ----------------------------------------------------------------- Ollama
  ollama:
    image: ollama/ollama:latest
    container_name: gst_ollama
    restart: unless-stopped
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'exec 3<>/dev/tcp/127.0.0.1/11434' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks: [gst_network]
    # After startup run once: docker exec gst_ollama ollama pull qwen2.5:7b-instruct

  # ----------------------------------------------------------------- Backend
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: gst_backend
    restart: unless-stopped
    environment:
      <<: *backend-env
      SERVICE_ROLE: api
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app
      - backend_data:/app/.cache
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
      qdrant: { condition: service_healthy }
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8000/api/v1/health')\" || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 10
    networks: [gst_network]

  # ------------------------------------------------------------------ Worker
  worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: gst_worker
    restart: unless-stopped
    command: ["celery", "-A", "app.workers.celery_app", "worker", "--loglevel=INFO", "--concurrency=2"]
    environment:
      <<: *backend-env
      SERVICE_ROLE: worker
    volumes:
      - ./backend:/app
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
      qdrant: { condition: service_healthy }
    networks: [gst_network]

  worker-beat:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: gst_worker_beat
    restart: unless-stopped
    command: ["celery", "-A", "app.workers.celery_app", "beat", "--loglevel=INFO"]
    environment:
      <<: *backend-env
      SERVICE_ROLE: beat
    volumes:
      - ./backend:/app
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
    networks: [gst_network]

  # ----------------------------------------------------------------- Frontend
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: gst_frontend
    restart: unless-stopped
    environment:
      NEXT_PUBLIC_API_BASE_URL: ${FRONTEND_API_BASE_URL:-http://localhost:8000}
    ports:
      - "3000:3000"
    depends_on:
      - backend
    networks: [gst_network]

  # ------------------------------------------------------------- Observability
  prometheus:
    image: prom/prometheus:latest
    container_name: gst_prometheus
    restart: unless-stopped
    volumes:
      - ./docker/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    ports:
      - "9090:9090"
    networks: [gst_network]

  grafana:
    image: grafana/grafana:latest
    container_name: gst_grafana
    restart: unless-stopped
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
    volumes:
      - grafana_data:/var/lib/grafana
    ports:
      - "3001:3000"
    depends_on:
      - prometheus
    networks: [gst_network]

  jaeger:
    image: jaegertracing/all-in-one:latest
    container_name: gst_jaeger
    restart: unless-stopped
    environment:
      COLLECTOR_OTLP_ENABLED: "true"
    ports:
      - "16686:16686" # UI
      - "4317:4317"   # OTLP gRPC
      - "4318:4318"   # OTLP HTTP
    networks: [gst_network]

networks:
  gst_network:
    driver: bridge

volumes:
  postgres_data:
  redis_data:
  qdrant_data:
  minio_data:
  ollama_data:
  backend_data:
  prometheus_data:
  grafana_data:
